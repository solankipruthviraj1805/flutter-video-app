name: Build Android APK

on:
push:
branches: [ main ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: zulu
      java-version: '17'

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: '3.19.x'
      channel: stable

  - name: Find Flutter project
    run: |
      PROJECT_DIR=$(find . -name pubspec.yaml -not -path '*/.dart_tool/*' -not -path '*/build/*' | head -n 1)
      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: pubspec.yaml not found"
        exit 1
      fi
      echo "PROJECT_DIR=$(dirname "$PROJECT_DIR")" >> "$GITHUB_ENV"
      echo "Found Flutter project: $PROJECT_DIR"

  - name: Install dependencies
    run: flutter pub get
    working-directory: ${{ env.PROJECT_DIR }}

  - name: Build APK
    run: flutter build apk --release
    working-directory: ${{ env.PROJECT_DIR }}

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: release-apk
      path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
```
