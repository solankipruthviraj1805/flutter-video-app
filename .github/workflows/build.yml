name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          mkdir -p app_source
          unzip -o flutter-video-app.zip -d app_source

      - name: Fix Gradle Wrapper and Permissions
        run: |
          find app_source -name "gradlew" -exec chmod +x {} \;
          find app_source -name "gradle-wrapper.properties" -exec sed -i 's/gradle-.*-bin.zip/gradle-7.5-all.zip/g' {} \;
          find app_source -name "gradle-wrapper.properties" -exec sed -i 's/gradle-.*-all.zip/gradle-7.5-all.zip/g' {} \;

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          CD_DIR=$(find app_source -name "pubspec.yaml" -exec dirname {} \;)
          if [ -n "$CD_DIR" ]; then
            cd "$CD_DIR"
            flutter pub get
            flutter build apk --release
          else
            echo "pubspec.yaml not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
