name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          mkdir -p app_source
          unzip -o flutter-video-app.zip -d app_source

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK and Fix Android Structure
        run: |
          CD_DIR=$(find app_source -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$CD_DIR" ]; then
            cd "$CD_DIR"
            echo "Found project at: $CD_DIR"
            
            # If android folder is missing, generate it automatically
            if [ ! -d "android" ]; then
              echo "Android folder missing. Generating Android files..."
              flutter create . --platforms=android
            fi
            
            # Fix gradlew permissions
            if [ -f "android/gradlew" ]; then
              chmod +x android/gradlew
            fi
            
            flutter pub get
            flutter build apk --release
          else
            echo "pubspec.yaml not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
